<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexaPlan — Project Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#07111f;
  --card:#0f172a;
  --card2:#111c31;
  --text:#f8fafc;
  --muted:#94a3b8;
  --primary:#00e5ff;
  --secondary:#ff00ff;
  --green:#00ff9d;
  --yellow:#ffd166;
  --red:#ff4d6d;
  --shadow:0 0 25px rgba(0,229,255,0.18);
}

body.light{
  --bg:#edf3ff;
  --card:#ffffff;
  --card2:#f8fbff;
  --text:#14213d;
  --muted:#5b6478;
  --primary:#1d4ed8;
  --secondary:#7c3aed;
  --green:#15803d;
  --yellow:#ca8a04;
  --red:#be123c;
  --shadow:0 12px 35px rgba(29,78,216,0.08);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:linear-gradient(135deg,#050816,var(--bg));
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  transition:0.35s ease;
}

body.light{
  background:linear-gradient(135deg,#edf4ff,#dbeafe);
}

.container{
  max-width:1500px;
  margin:auto;
  padding:30px;
}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:30px;
  flex-wrap:wrap;
}

.hero h1{
  font-family:'Orbitron',sans-serif;
  font-size:3rem;
  color:var(--primary);
}

body:not(.light) .hero h1{
  text-shadow:0 0 10px var(--primary),0 0 30px var(--primary);
}

.hero p{
  color:var(--muted);
  margin-top:8px;
}

.toggle-btn{
  border:none;
  padding:14px 18px;
  border-radius:16px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:white;
  font-weight:700;
}

.main-layout{
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:24px;
}

.card{
  background:rgba(15,23,42,0.8);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:28px;
  padding:24px;
  backdrop-filter:blur(14px);
  box-shadow:var(--shadow);
}

body.light .card{
  background:rgba(255,255,255,0.95);
  border:1px solid rgba(15,23,42,0.06);
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.card-title h2{
  font-size:1.25rem;
  color:var(--primary);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.08);
  background:var(--card2);
  color:var(--text);
  outline:none;
}

body.light input,
body.light select,
body.light textarea{
  background:#f8fbff;
  border:1px solid rgba(15,23,42,0.08);
}

textarea{
  min-height:110px;
  resize:vertical;
}

.primary-btn{
  border:none;
  width:100%;
  padding:15px;
  margin-top:18px;
  border-radius:16px;
  font-weight:700;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
}

.projects{
  display:flex;
  flex-direction:column;
  gap:18px;
  margin-top:25px;
}

.project-card{
  background:var(--card2);
  border-radius:24px;
  padding:22px;
  border:1px solid rgba(255,255,255,0.08);
}

.project-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.project-name{
  font-size:1.2rem;
  font-weight:700;
}

.project-meta{
  color:var(--muted);
  margin-top:10px;
  font-size:0.92rem;
}

.badge{
  padding:8px 14px;
  border-radius:999px;
  font-size:0.8rem;
  font-weight:700;
}

.pending{background:rgba(255,209,102,0.18);color:var(--yellow)}
.progress{background:rgba(0,229,255,0.18);color:var(--primary)}
.done{background:rgba(0,255,157,0.18);color:var(--green)}
.hold{background:rgba(255,77,109,0.18);color:var(--red)}

.task-list{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.task-item{
  padding:14px;
  border-radius:16px;
  background:rgba(255,255,255,0.03);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

body.light .task-item{
  background:#eef4ff;
}

.task-name{
  font-weight:600;
}

.task-info{
  color:var(--muted);
  font-size:0.85rem;
  margin-top:4px;
}

.task-controls{
  display:flex;
  gap:10px;
  align-items:center;
}

.small-btn{
  border:none;
  padding:10px 14px;
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.stat-card{
  padding:24px;
  border-radius:24px;
  background:var(--card2);
}

.stat-card h3{
  font-size:2rem;
  margin-top:10px;
}

.stat-card p{
  color:var(--muted);
}

.month-box{
  margin-top:18px;
  padding:20px;
  border-radius:24px;
  background:var(--card2);
}

.month-box ul{
  margin-top:12px;
  padding-left:18px;
  color:var(--muted);
}

.filter-row{
  margin-top:16px;
}

@media(max-width:1100px){
  .main-layout{
    grid-template-columns:1fr;
  }
}

@media(max-width:700px){
  .form-grid,
  .dashboard-grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:2.1rem;
  }
}
</style>
</head>
<body>

<div class="container">

<div class="hero">
  <div>
    <h1>NexaPlan</h1>
    <p>Royal productivity workspace for managing projects, vendors, compliance workflows & task operations.</p>
  </div>

  <button class="toggle-btn" onclick="toggleTheme()">🌗 Bright / Dark</button>
</div>

<div class="main-layout">

<div>
  <div class="card">

    <div class="card-title">
      <h2>Create New Project</h2>
    </div>

    <div class="form-grid">
      <input type="text" id="projectName" placeholder="Project Name">

      <select id="projectStatus">
        <option value="pending">Pending</option>
        <option value="progress">Ongoing</option>
        <option value="done">Completed</option>
        <option value="hold">On Hold</option>
      </select>

      <input type="date" id="projectStart">
      <input type="date" id="projectEnd">

      <input type="text" id="projectOwner" placeholder="Vendor / Client / Owner">
      <input type="text" id="projectCategory" placeholder="Department / Category">
    </div>

    <textarea id="projectDesc" placeholder="Project notes, compliance, approvals, workflow details..."></textarea>

    <button class="primary-btn" onclick="createProject()">Create Project</button>
  </div>

  <div class="filter-row">
    <input type="date" id="dateFilter" onchange="renderProjects()">
  </div>

  <div class="projects" id="projects"></div>
</div>

<div>
  <div class="card">
    <div class="card-title">
      <h2>Dashboard</h2>
    </div>

    <div class="dashboard-grid">
      <div class="stat-card">
        <p>Ongoing Projects</p>
        <h3 id="ongoingCount">0</h3>
      </div>

      <div class="stat-card">
        <p>Completed Projects</p>
        <h3 id="completedCount">0</h3>
      </div>

      <div class="stat-card">
        <p>Pending Projects</p>
        <h3 id="pendingCount">0</h3>
      </div>

      <div class="stat-card">
        <p>On Hold Projects</p>
        <h3 id="holdCount">0</h3>
      </div>
    </div>

    <div class="month-box">
      <h3>Completed This Month</h3>
      <ul id="monthCompleted"></ul>
    </div>
  </div>
</div>

</div>
</div>

<script>
let editProjectIndex = null;

function getProjects(){
  return JSON.parse(localStorage.getItem('nexaProjects')) || [];
}

function saveProjects(projects){
  localStorage.setItem('nexaProjects', JSON.stringify(projects));
}

function createProject(){
  const name = document.getElementById('projectName').value;
  const status = document.getElementById('projectStatus').value;
  const start = document.getElementById('projectStart').value;
  const end = document.getElementById('projectEnd').value;
  const owner = document.getElementById('projectOwner').value;
  const category = document.getElementById('projectCategory').value;
  const desc = document.getElementById('projectDesc').value;

  if(!name){
    alert('Please enter project name');
    return;
  }

  const projects = getProjects();

  const project = {
    name,
    status,
    start,
    end,
    owner,
    category,
    desc,
    tasks:[]
  };

  if(editProjectIndex !== null){
    project.tasks = projects[editProjectIndex].tasks;
    projects[editProjectIndex] = project;
    editProjectIndex = null;
  }else{
    projects.unshift(project);
  }

  saveProjects(projects);
  clearProjectForm();
  renderProjects();
}

function addTask(projectIndex){
  const taskName = prompt('Enter task name');

  if(!taskName) return;

  const projects = getProjects();

  projects[projectIndex].tasks.push({
    name:taskName,
    status:'pending'
  });

  saveProjects(projects);
  renderProjects();
}

function changeTaskStatus(projectIndex, taskIndex, status){
  const projects = getProjects();
  projects[projectIndex].tasks[taskIndex].status = status;
  saveProjects(projects);
  renderProjects();
}

function deleteProject(index){
  const projects = getProjects();
  projects.splice(index,1);
  saveProjects(projects);
  renderProjects();
}

function editProject(index){
  const p = getProjects()[index];

  document.getElementById('projectName').value = p.name;
  document.getElementById('projectStatus').value = p.status;
  document.getElementById('projectStart').value = p.start;
  document.getElementById('projectEnd').value = p.end;
  document.getElementById('projectOwner').value = p.owner;
  document.getElementById('projectCategory').value = p.category;
  document.getElementById('projectDesc').value = p.desc;

  editProjectIndex = index;
}

function renderProjects(){
  const container = document.getElementById('projects');
  const filter = document.getElementById('dateFilter').value;

  let projects = getProjects();

  if(filter){
    projects = projects.filter(p => p.start === filter);
  }

  container.innerHTML = '';

  projects.forEach((project,index)=>{
    const div = document.createElement('div');
    div.className = 'project-card';

    let taskHTML = '';

    project.tasks.forEach((task,tIndex)=>{
      taskHTML += `
      <div class="task-item">
        <div>
          <div class="task-name">${task.name}</div>
          <div class="task-info">Task Status: ${task.status.toUpperCase()}</div>
        </div>

        <div class="task-controls">
          <select onchange="changeTaskStatus(${index},${tIndex},this.value)">
            <option value="pending" ${task.status==='pending'?'selected':''}>Pending</option>
            <option value="progress" ${task.status==='progress'?'selected':''}>In Progress</option>
            <option value="done" ${task.status==='done'?'selected':''}>Completed</option>
            <option value="hold" ${task.status==='hold'?'selected':''}>On Hold</option>
          </select>
        </div>
      </div>`;
    });

    div.innerHTML = `
      <div class="project-top">
        <div>
          <div class="project-name">${project.name}</div>
          <div class="project-meta">
            👤 ${project.owner || '-'}<br>
            🗂 ${project.category || '-'}<br>
            📅 ${project.start || '-'} → ${project.end || '-'}
          </div>
        </div>

        <div class="badge ${project.status}">${project.status.toUpperCase()}</div>
      </div>

      <div class="project-meta" style="margin-top:15px;">
        ${project.desc || ''}
      </div>

      <div class="task-list">
        ${taskHTML || '<div class="project-meta">No tasks added yet.</div>'}
      </div>

      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;">
        <button class="small-btn" onclick="addTask(${index})">+ Add Task</button>
        <button class="small-btn" onclick="editProject(${index})">Edit</button>
        <button class="small-btn" onclick="deleteProject(${index})">Delete</button>
      </div>
    `;

    container.appendChild(div);
  });

  updateDashboard();
}

function updateDashboard(){
  const projects = getProjects();

  document.getElementById('ongoingCount').innerText = projects.filter(p=>p.status==='progress').length;
  document.getElementById('completedCount').innerText = projects.filter(p=>p.status==='done').length;
  document.getElementById('pendingCount').innerText = projects.filter(p=>p.status==='pending').length;
  document.getElementById('holdCount').innerText = projects.filter(p=>p.status==='hold').length;

  const monthList = document.getElementById('monthCompleted');
  monthList.innerHTML = '';

  const currentMonth = new Date().getMonth();

  projects.filter(p=>{
    if(!p.end || p.status !== 'done') return false;
    return new Date(p.end).getMonth() === currentMonth;
  }).forEach(p=>{
    const li = document.createElement('li');
    li.innerText = p.name;
    monthList.appendChild(li);
  });
}

function clearProjectForm(){
  document.getElementById('projectName').value='';
  document.getElementById('projectStart').value='';
  document.getElementById('projectEnd').value='';
  document.getElementById('projectOwner').value='';
  document.getElementById('projectCategory').value='';
  document.getElementById('projectDesc').value='';
}

function toggleTheme(){
  document.body.classList.toggle('light');

  localStorage.setItem(
    'nexaTheme',
    document.body.classList.contains('light') ? 'light' : 'dark'
  );
}

window.onload = function(){
  const theme = localStorage.getItem('nexaTheme');

  if(theme === 'light'){
    document.body.classList.add('light');
  }

  renderProjects();
}
</script>

</body>
</html>
